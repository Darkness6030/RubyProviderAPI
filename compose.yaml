services:
  generator:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - --spec
      - docs/provider_api.yaml
      - --provider
      - novapay
      - --overrides
      - docs/novapay_overrides.yaml
      - --lang
      - ruby
      - --output
      - output
      - --docs-output
      - output
